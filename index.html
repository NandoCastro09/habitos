<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF1EA">
<title>Hábitos da Mariana</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="description" content="Acompanhe seus hábitos, tarefas, sequências, humor e conquistas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EA; --surface:#FBFCFA; --ink:#1C2620; --muted:#5F6B63; --line:#D5DDD3; --track:#DCE3DA;
  --accent:#6E3B63; --accent-ink:#FFFFFF; --accent-soft:#EADDE6; --gold:#E0A526; --danger:#B3261E;
  --grid:rgba(28,38,32,.06); --shadow:0 1px 0 rgba(28,38,32,.06);
  --font:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --tabh:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1B211E; --ink:#E8EEE9; --muted:#9AA79F; --line:#2C3530; --track:#2A322E;
    --accent:#D8A6CB; --accent-ink:#2A1426; --accent-soft:#3A2735; --gold:#EBC15A; --danger:#F2B8B5;
    --grid:rgba(232,238,233,.05); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1B211E; --ink:#E8EEE9; --muted:#9AA79F; --line:#2C3530; --track:#2A322E;
  --accent:#D8A6CB; --accent-ink:#2A1426; --accent-soft:#3A2735; --gold:#EBC15A; --danger:#F2B8B5;
  --grid:rgba(232,238,233,.05); --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tabh) + 96px)}

/* hero: papel milimetrado */
.hero{margin:0 -16px;padding:22px 20px 18px;background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:16px 16px;background-position:-1px -1px;display:flex;gap:16px;align-items:center;justify-content:space-between}
.hero-text{min-width:0}
.date{margin:0;color:var(--muted);font-size:.9rem;text-transform:lowercase}
.hero h1{margin:.1em 0 .15em;font-size:clamp(1.6rem,7vw,2.1rem);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.phrase{margin:0;color:var(--muted);font-size:.92rem;max-width:30ch}
.ring-big{position:relative;flex:none;width:84px;height:84px}
.ring-big svg{display:block}
.ring-num{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring-num b{font-size:1.55rem;font-weight:800}
.ring-num small{font-size:.72rem;color:var(--muted);margin-top:2px}
.ring-big.full .ring-num b{color:var(--accent)}

/* semana */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 8px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border-radius:14px;min-height:64px}
.day .wd{font-size:.72rem;color:var(--muted);font-weight:600}
.day .dn{position:relative;width:34px;height:34px;display:grid;place-items:center}
.day .dn svg{position:absolute;inset:0}
.day .dn span{font-size:.85rem;font-weight:700}
.day.is-today .wd{color:var(--accent)}
.day.sel{background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.back-today{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--accent-soft);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:.9rem}
.back-today button{font-weight:700;color:var(--accent);flex:none}
.cats{display:flex;gap:6px;overflow-x:auto;margin:4px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;min-height:36px;padding:0 14px;border-radius:99px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:.85rem;font-weight:650;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);box-shadow:none}

/* cartões de hábito */
.group h2{font-size:.95rem;font-weight:700;color:var(--muted);margin:18px 4px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.habit{--c:var(--accent);display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:18px;padding:6px 8px 6px 6px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.habit.skip{opacity:.6}
.habit-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:6px;border-radius:14px}
.ico{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.45rem;position:relative;overflow:hidden}
.ico::before{content:"";position:absolute;inset:0;background:var(--c);opacity:.16}
.ico span{position:relative}
.txt{min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-weight:650;font-size:1.02rem;line-height:1.2;overflow-wrap:anywhere}
.habit.done .nm{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--c) 70%,transparent);text-decoration-thickness:2px;color:var(--muted)}
.habit.avoid.done .nm{text-decoration:none;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.74rem;line-height:1;padding:4px 7px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.warn{background:color-mix(in srgb,var(--gold) 24%,transparent);color:var(--ink)}
.chip.bad{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.ctl{flex:none;display:flex;align-items:center;gap:4px}
.minus{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--muted);font-size:1.3rem;font-weight:600}
.play{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--c);position:relative}
.play::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);opacity:.14}
.play svg{position:relative;width:16px;height:16px}
.mini{min-height:38px;padding:0 12px;border-radius:12px;font-size:.85rem;font-weight:700;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line)}
.check{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.check svg{position:absolute;inset:0}
.check .cnt{position:relative;font-weight:800;font-size:.9rem}
.habit.done .check.counter::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c)}
.habit.done .check.counter .cnt{color:#fff;font-size:1.2rem}
.check .tick{position:relative;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;border:2.5px solid var(--line);transition:background-color .15s,border-color .15s}
.habit.done .check .tick{background:var(--c);border-color:var(--c)}
.habit.slip .check .tick{background:var(--danger);border-color:var(--danger)}
.check .tick svg{position:static;width:24px;height:24px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
.habit.done .check .tick svg,.habit.slip .check .tick svg{opacity:1;transform:scale(1)}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.15)}}
.shake{animation:shake .3s ease}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.skipped{margin:18px 4px 0;font-size:.85rem;color:var(--muted)}
.note{margin:28px 8px 0;text-align:center;color:var(--muted);font-size:.9rem;font-style:italic}

/* diário */
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.moods button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;background:var(--bg)}
.moods span{font-size:1.6rem;line-height:1.1}
.moods small{font-size:.7rem;color:var(--muted)}
.moods button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.jtext{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border-radius:14px;padding:10px 12px;margin:0 0 10px;font-size:.92rem}

/* vazio / templates */
.empty{background:var(--surface);border-radius:22px;padding:20px 16px;margin-top:10px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.empty h2{margin:0 0 4px;font-size:1.3rem;font-weight:800}
.empty p{margin:0 0 14px;color:var(--muted)}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tpl{display:flex;align-items:center;gap:8px;text-align:left;padding:10px;border-radius:14px;background:var(--bg);font-size:.9rem;font-weight:600;line-height:1.2;min-height:52px}
.tpl .e{font-size:1.25rem}
.tpl small{display:block;font-size:.7rem;color:var(--muted);font-weight:600}
.tpl[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.tpl-row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px;scrollbar-width:none}
.tpl-row::-webkit-scrollbar{display:none}
.tpl-row .tpl{flex:none;min-height:40px;padding:8px 12px;font-size:.85rem}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;font-weight:700;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);z-index:20}
.fab svg{width:28px;height:28px}

/* tarefas */
.seg button{line-height:1.15}
.tseg button{font-size:.8rem;white-space:nowrap}
.tseg small{font-size:.72rem;font-weight:800;opacity:.75}
.tq{display:flex;gap:8px;margin-bottom:10px}
.tq .inp{flex:1;min-width:0}
.tq .btn{flex:none;width:48px;padding:0}
.tq .btn svg{width:22px;height:22px}
.ghead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ghead button{font-size:.85rem;font-weight:700;color:var(--accent);margin:18px 4px 8px}
.task{--c:var(--muted);display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:16px;padding:4px 8px 4px 2px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.card .task{background:var(--bg);box-shadow:none}
.tcheck{flex:none;width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.tcheck i{width:26px;height:26px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;transition:background-color .15s}
.tcheck svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:opacity .15s,transform .2s}
.task.done .tcheck i{background:var(--c)}
.task.done .tcheck svg{opacity:1;transform:scale(1)}
.task-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px 4px;border-radius:12px}
.task .nm{font-size:.98rem}
.task.done .nm{text-decoration:line-through;color:var(--muted)}
.steps{margin-bottom:8px}
.step{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line);min-height:44px}
.step:first-child{border-top:0}
.step .nm{flex:1;min-width:0;font-size:.95rem;font-weight:500}
.step.done .nm{text-decoration:line-through;color:var(--muted)}
.scheck{flex:none;width:40px;height:40px;display:grid;place-items:center}
.scheck i{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center}
.scheck svg{width:13px;height:13px;opacity:0}
.step.done .scheck i{background:var(--accent);border-color:var(--accent)}
.step.done .scheck svg{opacity:1}
.sdel{flex:none;width:40px;height:40px;color:var(--muted);font-size:1.3rem}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.74rem;font-weight:600;color:var(--muted)}
.tab .tb{position:absolute;top:6px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--danger);color:var(--surface);font-size:.68rem;font-weight:800;display:grid;place-items:center;line-height:1}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}

/* páginas */
.page-title{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:22px 4px 14px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.tile{background:var(--surface);border-radius:18px;padding:14px 12px;box-shadow:var(--shadow),0 0 0 1px var(--line)}
.tile b{display:block;font-size:1.6rem;font-weight:800;line-height:1.1}
.tile span{display:block;font-size:.78rem;color:var(--muted);line-height:1.25;margin-top:4px}
.card{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow),0 0 0 1px var(--line);margin-top:10px}
.card h2{margin:0 0 12px;font-size:1.05rem;font-weight:750}
.card p.hint{margin:-6px 0 12px;color:var(--muted);font-size:.88rem}
.card p.insight{margin:12px 0 0;font-size:.9rem}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow .ico{width:40px;height:40px;font-size:1.2rem;border-radius:12px}
.hrow .grow{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--track);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.hrow .pct{font-weight:800;font-size:.95rem;min-width:44px;text-align:right}

/* jardim */
.garden{display:flex;align-items:center;gap:12px}
.garden svg{flex:none}
.garden .gtxt{flex:1;min-width:0}
.garden h3{margin:0;font-size:1.25rem;font-weight:800}
.garden p{margin:2px 0 0;color:var(--muted);font-size:.86rem}

/* gráficos */
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px}
.bars.w8{grid-template-columns:repeat(8,1fr)}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .b i{display:block;width:100%;max-width:30px;border-radius:8px 8px 4px 4px;background:var(--accent);min-height:3px;opacity:.85}
.bars .b.best i{background:var(--gold);opacity:1}
.bars .b b{font-size:.7rem;font-weight:700}
.bars .b small{font-size:.7rem;color:var(--muted);white-space:nowrap}
.moodrow{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;text-align:center}
.moodrow span{font-size:1.05rem;line-height:1.4}
.moodrow small{display:block;font-size:.6rem;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--bg);border-radius:16px;padding:12px 6px;text-align:center}
.badge .be{font-size:1.8rem;line-height:1.2}
.badge b{display:block;font-size:.8rem;line-height:1.2;margin-top:4px}
.badge small{display:block;font-size:.7rem;color:var(--muted);margin-top:3px;line-height:1.2}
.badge.locked .be{filter:grayscale(1);opacity:.35}
.badge.locked b{color:var(--muted)}

/* heatmap */
.heat-wrap{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(7,auto);gap:3px;width:100%;min-width:250px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--track);position:relative;overflow:hidden}
.cell i{position:absolute;inset:0;background:var(--c,var(--accent))}
.cell.off{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.cell.none{opacity:.4}
.cell.future{background:transparent}
.cell.today{box-shadow:0 0 0 1.5px var(--ink)}
.legend{display:flex;align-items:center;justify-content:flex-end;gap:3px;margin-top:8px;font-size:.75rem;color:var(--muted)}
.legend .cell{width:11px;height:11px;aspect-ratio:auto}

/* forms */
label.f,.f{display:block;font-weight:650;font-size:.92rem;margin:16px 0 6px}
.inp{width:100%;min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emoji-grid button{aspect-ratio:1;border-radius:12px;font-size:1.35rem;display:grid;place-items:center}
.emoji-grid button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.colors{display:flex;flex-wrap:wrap;gap:10px}
.colors button{width:36px;height:36px;border-radius:50%;background:var(--c)}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--bg);border-radius:14px;padding:4px}
.seg button{min-height:40px;border-radius:10px;font-size:.85rem;font-weight:650;color:var(--muted);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{min-height:38px;padding:0 12px;border-radius:99px;background:var(--bg);font-size:.85rem;font-weight:650;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{aspect-ratio:1;border-radius:50%;font-weight:700;background:var(--bg);color:var(--muted);max-width:46px;justify-self:center;width:100%}
.days button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{font-size:.8rem;font-weight:650;color:var(--accent);padding:6px 10px;border-radius:99px;background:var(--accent-soft)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--bg);font-size:1.4rem;font-weight:700;box-shadow:inset 0 0 0 1px var(--line);flex:none}
.stepper output{min-width:30px;text-align:center;font-weight:800;font-size:1.1rem;white-space:nowrap}
.stepper .inp{flex:1;min-width:0}
.intent{display:flex;align-items:center;gap:8px}
.intent span{flex:none;color:var(--muted);font-size:.92rem}
.timein{display:flex;gap:8px;align-items:center}
.timein .inp{width:150px;flex:none}
.err{color:var(--danger);font-size:.85rem;margin:6px 0 0}
.fhint{color:var(--muted);font-size:.8rem;margin:6px 0 0}
.accents{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.accents button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.72rem;color:var(--muted);font-weight:600}
.accents button i{width:36px;height:36px;border-radius:50%;background:var(--c);display:block}
.accents button[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--c)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.backdrop{position:absolute;inset:0;background:rgba(10,14,12,.45);animation:fade .2s ease}
.sheet{position:relative;width:100%;max-width:560px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h2.st{margin:4px 0 2px;font-size:1.35rem;font-weight:800;letter-spacing:-.01em;overflow-wrap:anywhere}
.sheet .sub{margin:0;color:var(--muted);font-size:.9rem}
.sheet-actions{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.dhead{display:flex;align-items:center;gap:12px}
.dhead .ico{width:56px;height:56px;font-size:1.8rem;border-radius:16px}
.stats4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stats4 div{background:var(--bg);border-radius:14px;padding:12px}
.stats4 b{display:block;font-size:1.4rem;font-weight:800;line-height:1.1}
.stats4 span{font-size:.8rem;color:var(--muted)}
.goalbox{background:var(--bg);border-radius:14px;padding:12px;margin-bottom:14px;font-size:.9rem}
.timer{position:relative;width:220px;height:220px;margin:20px auto}
.timer svg{display:block}
.t-time{position:absolute;inset:0;display:grid;place-items:center;font-size:2.8rem;font-weight:800;font-variant-numeric:tabular-nums}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 90px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 16px;display:flex;gap:14px;align-items:center;font-size:.92rem;max-width:calc(100% - 32px);width:max-content;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{color:var(--bg);font-weight:800;text-decoration:underline}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:360px){
  .tiles{grid-template-columns:1fr 1fr}
  .emoji-grid{grid-template-columns:repeat(6,1fr)}
  .badges{grid-template-columns:1fr 1fr}
}

<script>
"use strict";
/* ================= constantes ================= */
const KEY = "habitos-mariana-v1";
const IN_CLAUDE = !!(window.claude && typeof window.claude.use === "function");
const COLORS = ["#6E3B63","#3D8B7D","#D0617A","#E0A526","#4F7CAC","#7FA35B","#A67C52","#8A6FD1"];
const EMOJIS = ["💧","📚","🧘‍♀️","🏃‍♀️","🚶‍♀️","🥗","🍎","😴","✏️","📐","🎨","🧴","🦷","💊","☀️","🌙","📝","🎧","🌿","💪","📵","☕","🧹","💖","💅","🥤","🛏️","📖","🍫","🚭","🙏","💸"];
const TIMES = [["manha","Manhã"],["tarde","Tarde"],["noite","Noite"],["qualquer","A qualquer hora"]];
const CATS = [["saude","Saúde"],["mente","Mente"],["estudos","Estudos"],["beleza","Autocuidado"],["casa","Casa"],["trabalho","Trabalho"],["outros","Outros"]];
const GOALS = [0,7,21,30,66,100];
const MOODS = [["😣","Péssimo"],["😕","Ruim"],["😐","Ok"],["🙂","Bom"],["🤩","Incrível"]];
const ACCENTS = {
  ameixa:{n:"Ameixa", l:["#6E3B63","#EADDE6"], d:["#D8A6CB","#3A2735","#2A1426"]},
  rosa:{n:"Rosa", l:["#B03F64","#F6DDE5"], d:["#F2A7BF","#3F2530","#3A0E1E"]},
  salvia:{n:"Sálvia", l:["#2F7A67","#D6EAE3"], d:["#8FD3BF","#1E3530","#0B2A22"]},
  oceano:{n:"Oceano", l:["#2F5F9E","#DAE5F3"], d:["#9DBEF0","#1F2A3C","#0E213F"]},
  lavanda:{n:"Lavanda", l:["#6A55B8","#E4DEF6"], d:["#BDB0F2","#2A2640","#1E1545"]},
  mel:{n:"Mel", l:["#8F5C0E","#F4E6CC"], d:["#EBC15A","#3A3020","#2E2006"]}
};
const WD_SHORT = ["D","S","T","Q","Q","S","S"];
const WD_LONG = ["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const WD_ABBR = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const ALL_DAYS = [0,1,2,3,4,5,6];
const TEMPLATES = [
  {name:"Beber água",emoji:"💧",color:"#4F7CAC",target:8,unit:"copos",time:"qualquer",cat:"saude"},
  {name:"Ler 10 páginas",emoji:"📚",color:"#6E3B63",time:"noite",cat:"estudos"},
  {name:"Meditar",emoji:"🧘‍♀️",color:"#3D8B7D",time:"manha",cat:"mente",timer:10},
  {name:"Skincare",emoji:"🧴",color:"#D0617A",time:"noite",cat:"beleza"},
  {name:"Croqui do dia",emoji:"✏️",color:"#A67C52",time:"tarde",cat:"estudos"},
  {name:"Caminhar",emoji:"🚶‍♀️",color:"#7FA35B",time:"tarde",cat:"saude",timer:20},
  {name:"Estudar focada",emoji:"📖",color:"#4F7CAC",time:"tarde",cat:"estudos",timer:25},
  {name:"Arrumar a cama",emoji:"🛏️",color:"#E0A526",time:"manha",cat:"casa"},
  {name:"Comer uma fruta",emoji:"🍎",color:"#E0A526",time:"qualquer",cat:"saude"},
  {name:"Sem celular antes de dormir",emoji:"📵",color:"#8A6FD1",time:"noite",cat:"mente"},
  {name:"Não roer as unhas",emoji:"💅",color:"#D0617A",time:"qualquer",cat:"beleza",kind:"avoid"},
  {name:"Sem refrigerante",emoji:"🥤",color:"#3D8B7D",time:"qualquer",cat:"saude",kind:"avoid"}
];
const PHRASES = [
  "Um pouquinho todo dia vira muito.",
  "Não precisa ser perfeito, só precisa acontecer.",
  "Perdeu um dia? Tudo bem. Só não deixa virar dois.",
  "Começa pequeno. Tipo, bem pequeno mesmo.",
  "Cada check é um voto na pessoa que você quer ser.",
  "Hoje conta, mesmo que seja só um pouco.",
  "Constância ganha de intensidade.",
  "Faz o mínimo nos dias ruins. Já é vitória."
];
const PRIOS = [["Nenhuma","var(--muted)"],["Baixa","#4F7CAC"],["Média","var(--gold)"],["Alta","var(--danger)"]];
const REPEATS = [["","Não repete"],["daily","Todo dia"],["weekdays","Dias úteis"],["weekly","Toda semana"],["monthly","Todo mês"]];
const PLANT = [[0,"Semente"],[3,"Broto"],[10,"Mudinha"],[25,"Plantinha"],[50,"Planta jovem"],[100,"Cheia de botões"],[175,"Florida"],[275,"Frondosa"],[400,"Jardim inteiro"]];

/* ================= datas (horário local) ================= */
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const dow = s => parseD(s).getDay();
const isDateStr = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

/* ================= estado ================= */
function defaultState(){
  return {v:2, name:"Mariana", note:"Feito com carinho pelo Nando 💛", theme:"auto", accent:"ameixa", sound:true, onboarded:false,
          habits:[], log:{}, skips:{}, journal:{}, seenBadges:[], tasks:[], tasksDone:0, updatedAt:0};
}
const clampInt = (v,min,max,def) => { v = Math.round(Number(v)); return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : def; };
function cleanHabit(h){
  let days = Array.isArray(h.days) ? [...new Set(h.days.map(Number).filter(d => Number.isInteger(d) && d>=0 && d<=6))].sort((a,b)=>a-b) : ALL_DAYS.slice();
  if (!days.length) days = ALL_DAYS.slice();
  const kind = h.kind === "avoid" ? "avoid" : "build";
  const out = {
    id: String(h.id).slice(0,40),
    name: String(h.name).trim().slice(0,60),
    emoji: (typeof h.emoji === "string" && h.emoji.trim()) ? h.emoji.trim().slice(0,16) : "✨",
    color: /^#[0-9a-fA-F]{6}$/.test(h.color) ? h.color : COLORS[0],
    kind,
    target: kind === "avoid" ? 1 : clampInt(h.target,1,99,1),
    unit: kind === "avoid" ? "" : (typeof h.unit === "string" ? h.unit.slice(0,20) : ""),
    days,
    time: TIMES.some(t => t[0] === h.time) ? h.time : "qualquer",
    intent: typeof h.intent === "string" ? h.intent.slice(0,60) : "",
    cat: CATS.some(c => c[0] === h.cat) ? h.cat : "outros",
    timer: kind === "avoid" ? 0 : clampInt(h.timer,0,180,0),
    remind: typeof h.remind === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(h.remind) ? h.remind : "",
    goal: clampInt(h.goal,0,365,0),
    archived: h.archived === true,
    createdAt: isDateStr(h.createdAt) ? h.createdAt : today()
  };
  if (Number.isInteger(h.tpl)) out.tpl = h.tpl;
  return out;
}
function cleanTask(t){
  const due = isDateStr(t.due) ? t.due : "";
  const steps = Array.isArray(t.steps) ? t.steps.filter(s => s && typeof s.t === "string" && s.t.trim()).slice(0,30).map(s => ({t:s.t.trim().slice(0,100), done:s.done === true})) : [];
  return {
    id: String(t.id).slice(0,40),
    title: String(t.title).trim().slice(0,120),
    notes: typeof t.notes === "string" ? t.notes.slice(0,1000) : "",
    due,
    time: due && typeof t.time === "string" && /^([01]\d|2[0-3]):[0-5]\d$/.test(t.time) ? t.time : "",
    prio: clampInt(t.prio,0,3,0),
    cat: CATS.some(c => c[0] === t.cat) ? t.cat : "",
    repeat: due && REPEATS.some(r => r[0] === t.repeat) ? t.repeat : "",
    steps,
    done: t.done === true,
    doneAt: t.done === true && isDateStr(t.doneAt) ? t.doneAt : "",
    createdAt: isDateStr(t.createdAt) ? t.createdAt : today()
  };
}
function sanitize(o){
  if (!o || typeof o !== "object" || !Array.isArray(o.habits)) return null;
  const s = defaultState();
  if (typeof o.name === "string") s.name = o.name.slice(0,40);
  if (typeof o.note === "string") s.note = o.note.slice(0,160);
  if (["auto","light","dark"].includes(o.theme)) s.theme = o.theme;
  if (ACCENTS[o.accent]) s.accent = o.accent;
  s.sound = o.sound !== false;
  s.updatedAt = Number(o.updatedAt) || 0;
  s.seenBadges = Array.isArray(o.seenBadges) ? o.seenBadges.filter(x => typeof x === "string").slice(0,60) : [];
  const seen = new Set();
  s.habits = o.habits.filter(h => h && typeof h.id === "string" && h.id && typeof h.name === "string" && h.name.trim())
    .map(cleanHabit).filter(h => !seen.has(h.id) && seen.add(h.id));
  s.onboarded = o.onboarded === true || (o.onboarded === undefined && s.habits.length > 0);
  const byId = Object.fromEntries(s.habits.map(h => [h.id,h]));
  if (o.log && typeof o.log === "object"){
    for (const [d, entry] of Object.entries(o.log)){
      if (!isDateStr(d) || !entry || typeof entry !== "object") continue;
      const clean = {};
      for (const [id, n] of Object.entries(entry)){
        if (!byId[id]) continue;
        const c = clampInt(n, 0, byId[id].target, 0);
        if (c > 0) clean[id] = c;
      }
      if (Object.keys(clean).length) s.log[d] = clean;
    }
  }
  if (o.skips && typeof o.skips === "object"){
    for (const [d, entry] of Object.entries(o.skips)){
      if (!isDateStr(d) || !entry || typeof entry !== "object") continue;
      const clean = {};
      for (const id of Object.keys(entry)) if (byId[id] && entry[id]) clean[id] = 1;
      if (Object.keys(clean).length) s.skips[d] = clean;
    }
  }
  if (o.journal && typeof o.journal === "object"){
    for (const [d, j] of Object.entries(o.journal)){
      if (!isDateStr(d) || !j || typeof j !== "object") continue;
      const mood = clampInt(j.mood,0,5,0), text = typeof j.text === "string" ? j.text.slice(0,2000) : "";
      if (mood || text.trim()) s.journal[d] = {mood, text};
    }
  }
  if (Array.isArray(o.tasks)){
    const seenT = new Set();
    s.tasks = o.tasks.filter(t => t && typeof t.id === "string" && t.id && typeof t.title === "string" && t.title.trim())
      .map(cleanTask).filter(t => !seenT.has(t.id) && seenT.add(t.id)).slice(0,2000);
  }
  s.tasksDone = Math.max(clampInt(o.tasksDone,0,1e7,0), s.tasks.filter(t => t.done).length);
  return s;
}
function loadState(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const s = sanitize(JSON.parse(raw)); if (s) return s; } } catch(e){}
  return defaultState();
}
let state = loadState();
let storageOk = true;
function persistLocal(){
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
    storageOk = localStorage.getItem(KEY) !== null;
  } catch(e){ storageOk = false; }
}
function save(){ state.updatedAt = Date.now(); persistLocal(); scheduleSync(); }

const ui = { tab:"today", selDate: today(), followToday:true, cat:"all", form:null, tfilter:"today", tform:null, pop:null, shake:null, dl:null, notified:new Set() };

/* ================= sincronização opcional (conta Claude) ================= */
const sync = { ref:null, timer:null, on:false };
async function initCaps(){
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("downloads").then(d => { ui.dl = d || null; if (ui.dl && ui.tab === "settings" && $("#sheet").hidden) render(); }).catch(() => {});
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/state");
    const snap = await ref.get();
    const remote = snap.exists ? snap.data() : null;
    if (remote && typeof remote.json === "string" && (Number(remote.updatedAt)||0) > (state.updatedAt||0)){
      const parsed = sanitize(JSON.parse(remote.json));
      if (parsed){ state = parsed; persistLocal(); markBadgesSeen(); if ($("#sheet").hidden) render(); }
    }
    sync.ref = ref; sync.on = true;
    if (!remote || (Number(remote.updatedAt)||0) < state.updatedAt) await pushSync();
    if (ui.tab === "settings" && $("#sheet").hidden) render();
  } catch(e){ sync.ref = null; sync.on = false; }
}
function scheduleSync(){ if (!sync.ref) return; clearTimeout(sync.timer); sync.timer = setTimeout(pushSync, 900); }
async function pushSync(){
  if (!sync.ref) return;
  try { await sync.ref.set({updatedAt: state.updatedAt, json: JSON.stringify(state)}); }
  catch(e){ sync.ref = null; sync.on = false; }
}

/* ================= lógica de hábitos ================= */
const habitById = id => state.habits.find(h => h.id === id);
const live = () => state.habits.filter(h => !h.archived);
const onDay = (h, d) => d >= h.createdAt && h.days.includes(dow(d));
const isSkipped = (h, d) => !!(state.skips[d] && state.skips[d][h.id]);
const counts = (h, d) => onDay(h, d) && !isSkipped(h, d);
const getCount = (h, d) => (state.log[d] && state.log[d][h.id]) || 0;
const isDone = (h, d) => h.kind === "avoid" ? getCount(h, d) === 0 : getCount(h, d) >= h.target;
function setCount(h, d, n){
  n = clampInt(n, 0, h.target, 0);
  if (n > 0){ (state.log[d] = state.log[d] || {})[h.id] = n; }
  else if (state.log[d]){ delete state.log[d][h.id]; if (!Object.keys(state.log[d]).length) delete state.log[d]; }
}
function setSkip(h, d, on){
  if (on){ (state.skips[d] = state.skips[d] || {})[h.id] = 1; }
  else if (state.skips[d]){ delete state.skips[d][h.id]; if (!Object.keys(state.skips[d]).length) delete state.skips[d]; }
}
const inWindow = d => d >= addDays(today(),-6) && d <= today();
const isBefore = (h, d) => d < h.createdAt;
/* aparece na tela: dias da semana do hábito, a partir da criação OU dentro dos últimos 7 dias (pra poder marcar dias anteriores) */
const shownOn = (h, d) => h.days.includes(dow(d)) && (d >= h.createdAt || inWindow(d));
function viewProgress(d){
  const hs = live().filter(h => shownOn(h, d) && !isSkipped(h, d));
  return { done: hs.filter(h => !isBefore(h, d) && isDone(h, d)).length, total: hs.length };
}
function dayProgress(d){
  const hs = live().filter(h => counts(h, d));
  return { done: hs.filter(h => isDone(h, d)).length, total: hs.length };
}
function streak(h){
  const t = today();
  let d = t;
  if (counts(h,t) && !isDone(h,t)){ if (h.kind === "avoid") return 0; d = addDays(t,-1); }
  let s = 0;
  for (let i = 0; i < 3660 && d >= h.createdAt; i++, d = addDays(d,-1)){
    if (!counts(h,d)) continue;
    if (isDone(h,d)) s++; else break;
  }
  return s;
}
function bestStreak(h){
  const t = today(); let best = 0, cur = 0;
  for (let d = h.createdAt, i = 0; d <= t && i < 3660; d = addDays(d,1), i++){
    if (!counts(h,d)) continue;
    if (isDone(h,d)){ cur++; if (cur > best) best = cur; }
    else if (d !== t || h.kind === "avoid") cur = 0;
  }
  return best;
}
function rate(h, days){
  const t = today(); let sched = 0, done = 0;
  for (let i = 0; i < days; i++){
    const d = addDays(t,-i);
    if (d < h.createdAt) break;
    if (!counts(h,d)) continue;
    const dn = isDone(h,d);
    if (d === t && !dn && h.kind !== "avoid") continue; // hoje ainda está em aberto
    sched++; if (dn) done++;
  }
  return sched ? done / sched : null;
}
function totalDone(h){
  const t = today(); let n = 0;
  for (let d = h.createdAt, i = 0; d <= t && i < 3660; d = addDays(d,1), i++) if (counts(h,d) && isDone(h,d)) n++;
  return n;
}
function missedLast(h){
  if (h.kind === "avoid") return false;
  const t = today();
  for (let i = 1; i <= 7; i++){
    const d = addDays(t,-i);
    if (d < h.createdAt) return false;
    if (counts(h,d)) return !isDone(h,d);
  }
  return false;
}
const earliest = () => live().reduce((m,h) => h.createdAt < m ? h.createdAt : m, today());
function perfectStreak(){
  if (!live().length) return 0;
  const t = today(), start = earliest();
  const p0 = dayProgress(t);
  let d = (p0.total && p0.done < p0.total) ? addDays(t,-1) : t, s = 0;

function nextDue(x){

  const late = pend.filter(x => x.due && x.due < t), tod = pend.filter(x => x.due === t), tom = pend.filter(x => x.due === tm);

  return g;

function habitCard(x, d){

/* ================= tela Progresso ================= */
function heatmap(levelFn, color){
  const t = today(), weeks = 15;
  const start = addDays(t, -(weeks-1)*7 - dow(t));
  let h = `<div class="heat-wrap"><div class="heat" style="--c:${color}">`;
  for (let i = 0; i < weeks*7; i++){
    const d = addDays(start, i);
    if (d > t){ h += `<div class="cell future"></div>`; continue; }
    const lv = levelFn(d); // null = sem agenda, -1 = antes de existir, 0..1
    const cls = lv === -1 ? "none" : lv === null ? "off" : "";
    const inner = lv > 0 ? `<i style="opacity:${(0.25 + 0.75*lv).toFixed(2)}"></i>` : "";
    h += `<div class="cell ${cls} ${d === t ? "today" : ""}" title="${d}">${inner}</div>`;
  }
  return h + `</div></div><div class="legend" style="--c:${color}">menos <span class="cell"></span><span class="cell"><i style="opacity:.4"></i></span><span class="cell"><i style="opacity:.7"></i></span><span class="cell"><i></i></span> mais</div>`;
}
function habitLevel(x){ return d => d < x.createdAt ? -1 : (!onDay(x,d) || isSkipped(x,d)) ? null : isDone(x,d) ? 1 : (x.kind === "avoid" ? 0 : getCount(x,d)/x.target); }
function plantSVG(lv){
  const H = [0,16,28,40,52,60,66,72,76][lv], base = 92;
  let s = `<svg viewBox="0 0 120 132" width="104" height="114" aria-hidden="true">`;
  if (lv >= 8) s += `<circle cx="18" cy="30" r="3" fill="var(--gold)"/><circle cx="102" cy="22" r="2.5" fill="var(--gold)"/><circle cx="96" cy="60" r="2" fill="var(--gold)"/>`;
  if (lv === 0) s += `<ellipse cx="60" cy="${base-2}" rx="6" ry="4" fill="#8B5E3C"/>`;
  else {
    const top = base - H;
    s += `<path d="M60 ${base} C 54 ${base - H*0.45}, 66 ${base - H*0.6}, 60 ${top}" fill="none" stroke="#4E7F3E" stroke-width="3.2" stroke-linecap="round"/>`;
    const n = Math.min(lv*2, 10);
    for (let k = 0; k < n; k++){
      const y = base - H*(k+1)/(n+1), side = k % 2 ? 1 : -1, sz = 7 + Math.min(lv,5);
      s += `<ellipse cx="${60 + side*(sz*0.8)}" cy="${y.toFixed(1)}" rx="${sz}" ry="${(sz*0.45).toFixed(1)}" fill="#6FA35A" transform="rotate(${side*-28} ${60 + side*(sz*0.8)} ${y.toFixed(1)})"/>`;
    }
    const flower = (cx, cy, r) => { let f = ""; for (let a = 0; a < 5; a++){ const ang = a*72*Math.PI/180; f += `<circle cx="${(cx + Math.cos(ang)*r).toFixed(1)}" cy="${(cy + Math.sin(ang)*r).toFixed(1)}" r="${r*0.8}" fill="#E58DB0"/>`; } return f + `<circle cx="${cx}" cy="${cy}" r="${r*0.65}" fill="#F2C94C"/>`; };
    if (lv === 5) s += `<ellipse cx="60" cy="${top-3}" rx="5" ry="7" fill="#E58DB0"/>`;
    if (lv >= 6) s += flower(60, top-4, 7);
    if (lv >= 7){ s += `<path d="M60 ${base-H*0.55} q -16 -6 -22 -18" fill="none" stroke="#4E7F3E" stroke-width="2.4"/>` + flower(38, base-H*0.55-18, 5); }
    if (lv >= 8){ s += `<path d="M60 ${base-H*0.4} q 16 -4 22 -16" fill="none" stroke="#4E7F3E" stroke-width="2.4"/>` + flower(82, base-H*0.4-16, 5); }
  }
  s += `<path d="M36 ${base} h48 l-6 34 h-36 z" fill="var(--accent)"/><rect x="32" y="${base-4}" width="56" height="10" rx="3" fill="var(--accent)"/><rect x="32" y="${base-4}" width="56" height="10" rx="3" fill="#000" opacity=".12"/>`;
  return s + `</svg>`;
}
function viewStats(){
  let h = `<h1 class="page-title">Progresso</h1>`;
  const hasTasks = state.tasks.length > 0 || state.tasksDone > 0;
  if (!state.habits.length){
    return h + `<div class="card"><h2>Nada por aqui ainda</h2><p class="hint" style="margin:0">Crie um hábito na aba Hoje e os gráficos aparecem aqui.</p></div>` + (hasTasks ? taskStatsCard() : "");
  }
  const checks = totalCheckins(), lv = plantLevel(checks), next = PLANT[lv+1];
  h += `<div class="card garden">${plantSVG(lv)}<div class="gtxt"><p>Seu jardim, nível ${lv+1} de ${PLANT.length}</p><h3>${PLANT[lv][1]}</h3>
    ${next ? `<div class="bar"><i style="width:${Math.round((checks - PLANT[lv][0]) / (next[0] - PLANT[lv][0]) * 100)}%"></i></div><p>Faltam ${next[0] - checks} check-ins pra virar “${next[1]}”.</p>` : `<p>Nível máximo. Que jardim!</p>`}
  </div></div>`;
  const ps = perfectStreak();
  h += `<div class="tiles">
    <div class="tile"><b>${ps}</b><span>${ps === 1 ? "dia perfeito seguido" : "dias perfeitos seguidos"}</span></div>
    <div class="tile"><b>${perfectDays(30)}</b><span>dias perfeitos em 30 dias</span></div>
    <div class="tile"><b>${checks}</b><span>hábitos cumpridos no total</span></div>
  </div>`;
  if (live().length){
    const start = earliest();
    h += `<div class="card"><h2>Últimas 15 semanas</h2><p class="hint">Quanto mais forte a cor, mais hábitos cumpridos no dia.</p>${heatmap(d => {
      if (d < start) return -1; const p = dayProgress(d); return p.total ? p.done / p.total : null; }, "var(--accent)")}</div>`;

    // melhor dia da semana
    const t = today(), dn = Array(7).fill(0), tt = Array(7).fill(0);
    for (let i = 1; i <= 84; i++){ const d = addDays(t,-i); if (d < start) break; const p = dayProgress(d); dn[dow(d)] += p.done; tt[dow(d)] += p.total; }
    const wr = tt.map((n,i) => n ? dn[i]/n : null), valid = wr.filter(v => v !== null);
    if (valid.length >= 3){
      const max = Math.max(...valid), min = Math.min(...valid), bi = wr.indexOf(max), wi = wr.indexOf(min);
      h += `<div class="card"><h2>Seus dias da semana</h2><p class="hint">Aproveitamento por dia, últimas 12 semanas.</p><div class="bars">${wr.map((v,i) => `<div class="b ${i === bi && max > 0 ? "best" : ""}"><b>${v === null ? "" : Math.round(v*100) + "%"}</b><i style="height:${v === null ? 0 : Math.max(3, Math.round(v*90))}px"></i><small>${WD_ABBR[i]}</small></div>`).join("")}</div>
      ${max > min ? `<p class="insight">Seu melhor dia é <b>${WD_LONG[bi]}</b>. ${WD_LONG[wi][0].toUpperCase() + WD_LONG[wi].slice(1)} é o mais difícil, vale deixar esse dia mais leve.</p>` : ""}</div>`;
    }
    // semanas
    const wk = [], ws0 = addDays(t, -dow(t));
    for (let w = 7; w >= 0; w--){
      const ws = addDays(ws0, -7*w); let a = 0, b = 0;
      for (let k = 0; k < 7; k++){ const d = addDays(ws,k); if (d > t || d < start) continue; const p = dayProgress(d); a += p.done; b += p.total; }
      wk.push({ws, v: b ? a/b : null});
    }
    if (wk.filter(w => w.v !== null).length >= 2){
      h += `<div class="card"><h2>Semana a semana</h2><p class="hint">Aproveitamento das últimas 8 semanas.</p><div class="bars w8">${wk.map((w,i) => `<div class="b"><b>${w.v === null ? "" : Math.round(w.v*100) + "%"}</b><i style="height:${w.v === null ? 0 : Math.max(3, Math.round(w.v*90))}px"></i><small>${i === 7 ? "atual" : parseD(w.ws).getDate() + "/" + (parseD(w.ws).getMonth()+1)}</small></div>`).join("")}</div></div>`;
    }
  }
  // humor
  const t = today(), moodDays = Object.keys(state.journal).filter(d => state.journal[d].mood);
  if (moodDays.length){
    let row = "";
    for (let i = 13; i >= 0; i--){ const d = addDays(t,-i), m = state.journal[d] && state.journal[d].mood; row += `<div><span>${m ? MOODS[m-1][0] : "·"}</span><small>${parseD(d).getDate()}</small></div>`; }
    const good = [], bad = [];
    for (const d of moodDays){ const p = dayProgress(d); if (!p.total) continue; const m = state.journal[d].mood; if (m >= 4) good.push(p.done/p.total); else if (m <= 2) bad.push(p.done/p.total); }
    const avg = a => Math.round(a.reduce((x,y) => x+y, 0) / a.length * 100);
    const insight = good.length >= 3 && bad.length >= 3
      ? `Nos dias bons você cumpre <b>${avg(good)}%</b> dos hábitos; nos difíceis, <b>${avg(bad)}%</b>.`
      : `Registre o humor por mais alguns dias pra ver como ele conversa com seus hábitos.`;
    h += `<div class="card"><h2>Humor</h2><p class="hint">Últimos 14 dias.</p><div class="moodrow">${row}</div><p class="insight">${insight}</p></div>`;
  }
  // por hábito
  if (live().length){
    h += `<div class="card"><h2>Por hábito</h2><p class="hint">Aproveitamento nos últimos 30 dias.</p>`;
    for (const x of live()){
      const r = rate(x, 30), st = streak(x);
      h += `<button class="hrow" data-action="open" data-id="${x.id}" style="--c:${x.color}">
        <span class="ico"><span>${esc(x.emoji)}</span></span>
        <span class="grow"><span class="nm" style="display:block">${esc(x.name)}</span><span class="bar"><i style="width:${r === null ? 0 : Math.round(r*100)}%"></i></span></span>
        <span class="pct">${r === null ? "—" : Math.round(r*100) + "%"}${st ? `<br><small style="font-weight:600;color:var(--muted)">🔥 ${st}</small>` : ""}</span>
      </button>`;
    }
    h += `</div>`;
  }
  if (hasTasks) h += taskStatsCard();
  const bs = badges(), got = bs.filter(b => b.ok).length;
  h += `<div class="card"><h2>Conquistas</h2><p class="hint">${got} de ${bs.length} desbloqueadas.</p><div class="badges">${bs.map(b => `<div class="badge ${b.ok ? "" : "locked"}"><div class="be">${b.e}</div><b>${b.n}</b><small>${b.ok ? b.d : (b.p ? b.d + " (" + b.p + ")" : b.d)}</small></div>`).join("")}</div></div>`;
  const arch = state.habits.filter(x => x.archived);
  if (arch.length){
    h += `<div class="card"><h2>Arquivados</h2><p class="hint">Não aparecem no dia a dia, mas o histórico fica guardado.</p>${arch.map(x => `<button class="hrow" data-action="open" data-id="${x.id}" style="--c:${x.color}"><span class="ico"><span>${esc(x.emoji)}</span></span><span class="grow nm">${esc(x.name)}</span><span class="pct" style="font-weight:600;color:var(--muted)">abrir</span></button>`).join("")}</div>`;
  }
  return h;
}

let tmr = null;
function openTimer(id){
  const x = habitById(id); if (!x || !x.timer) return;
  stopTimer();
  tmr = {id, day:ui.selDate, total:x.timer*60, remaining:x.timer*60, endAt:null, iv:null, lock:null, finished:false};
  openSheet(`<h2 class="st" id="sheet-title">${esc(x.emoji + " " + x.name)}</h2><p class="sub">Timer de ${x.timer} min. Quando terminar, o hábito é marcado sozinho.</p>
  <div class="timer"><div id="t-ring"></div><div class="t-time" id="t-time" aria-live="off"></div></div>
  <div class="row"><button class="btn primary" data-action="t-toggle" id="t-toggle">Iniciar</button><button class="btn" data-action="t-reset">Reiniciar</button></div>
  <div class="sheet-actions"><button class="btn block" data-action="t-done" id="t-done">Já fiz, marcar agora</button><button class="btn block" data-action="close">Fechar</button></div>`);
  paintTimer();
}
function paintTimer(){
  if (!tmr) return;
  const x = habitById(tmr.id), el = $("#t-time"), rg = $("#t-ring"), bt = $("#t-toggle");
  if (!x || !el) return;
  const s = Math.ceil(tmr.remaining);
  el.textContent = tmr.finished ? "Feito!" : `${pad(Math.floor(s/60))}:${pad(s%60)}`;
  rg.innerHTML = ring(1 - tmr.remaining/tmr.total, 220, 12, x.color);
  bt.textContent = tmr.finished ? "Concluído" : tmr.endAt ? "Pausar" : (tmr.remaining < tmr.total ? "Continuar" : "Iniciar");
  bt.disabled = tmr.finished;
  const td = $("#t-done"); if (td) td.hidden = tmr.finished;
}
function tickTimer(){
  if (!tmr || !tmr.endAt) return;
  tmr.remaining = Math.max(0, (tmr.endAt - Date.now())/1000);
  if (tmr.remaining <= 0) finishTimer(); else paintTimer();
}
function releaseLock(){ if (tmr && tmr.lock){ try { tmr.lock.release(); } catch(e){} tmr.lock = null; } }
function pauseTimer(){ if (!tmr) return; clearInterval(tmr.iv); tmr.iv = null; if (tmr.endAt){ tmr.remaining = Math.max(0,(tmr.endAt - Date.now())/1000); tmr.endAt = null; } releaseLock(); }
function stopTimer(){ if (!tmr) return; pauseTimer(); tmr = null; }
function finishTimer(){
  if (!tmr) return;
  const id = tmr.id, d = tmr.day;
  pauseTimer(); tmr.remaining = 0; tmr.finished = true; paintTimer();
  vibrate([200,100,200]); sfx("timer");
  const x = habitById(id);
  if (x && !isDone(x,d)) bump(x, d, 1, true);
}

}

  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cols = [...COLORS, "#F2C94C"];
  const ps = Array.from({length:130}, () => ({x:W/2 + (Math.random()-.5)*60, y:H*0.35, vx:(Math.random()-.5)*11, vy:-Math.random()*12-4, r:Math.random()*Math.PI, vr:(Math.random()-.5)*.3, w:6+Math.random()*6, h:4+Math.random()*4, c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0 = performance.now();
  (function frame(now){
    const el = now - t0; ctx.clearRect(0,0,W,H);
    for (const p of ps){ p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - el/2400); ctx.fillStyle = p.c; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx.restore(); }
    if (el < 2400) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}

function isDarkNow(){ return state.theme === "dark" || (state.theme === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches); }
function applyTheme(){
  const r = document.documentElement;
  if (state.theme === "auto") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", state.theme);
  const a = ACCENTS[state.accent] || ACCENTS.ameixa;
  if (isDarkNow()){ r.style.setProperty("--accent", a.d[0]); r.style.setProperty("--accent-soft", a.d[1]); r.style.setProperty("--accent-ink", a.d[2]); }
  else { r.style.setProperty("--accent", a.l[0]); r.style.setProperty("--accent-soft", a.l[1]); r.style.setProperty("--accent-ink", "#FFFFFF"); }
  const bg = getComputedStyle(r).getPropertyValue("--bg").trim();
  const m = document.querySelector('meta[name="theme-color"]'); if (m && bg) m.setAttribute("content", bg);
}
function render(){
  applyTheme();
  const main = $("#main");
  main.innerHTML = ui.tab === "today" ? viewToday() : ui.tab === "tasks" ? viewTasks() : ui.tab === "stats" ? viewStats() : viewSettings();

}

/* mudança de contagem com celebrações */
function bump(x, d, delta, fromTimer){
  const before = viewProgress(d);
  if (isBefore(x, d)){ if (delta <= 0) return; x.createdAt = d; }
  const was = isDone(x, d);
  setCount(x, d, getCount(x, d) + delta);
  const now = isDone(x, d);
  if (x.kind !== "avoid" && now && !was){ ui.pop = x.id; vibrate(15); if (!fromTimer) sfx("done"); }
  if (x.kind === "avoid" && !now) vibrate(30);
  afterChange(d, before);
}
function afterChange(d, before){
  save(); render();
  const after = viewProgress(d);
  let party = false;
  if (after.total && after.done === after.total && before.done < before.total){
    party = true; confetti(); sfx("full"); vibrate([20,40,20]);
    toast(d === today() ? "Dia completo! 🎉" : "Dia completo 🎉");
  }
  const nb = checkBadges();
  if (nb){ setTimeout(() => toast(`🏅 Nova conquista: ${nb.n}`), party ? 1400 : 0); if (!party) confetti(); }
}

/* ================= downloads ================= */
async function offerDownload(filename, data){
  if (ui.dl){
    try { await ui.dl.save({filename, data}); }
    catch(e){ if (!e || e.code !== "declined") toast("Não deu pra baixar aqui. Use Copiar backup."); }
    return;
  }
  if (IN_CLAUDE) return;
  const type = filename.endsWith(".csv") ? "text/csv" : "application/json";
  try {
    const file = new File([data], filename, {type});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:filename}); return; }
  } catch(e){ if (e && e.name === "AbortError") return; }
  try {
    const url = URL.createObjectURL(new Blob([data], {type}));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch(e){ toast("Não deu pra baixar aqui. Use Copiar backup."); }
}
function buildCSV(){
  const q = v => { const s = String(v); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const rows = [["data","dia da semana","hábito","categoria","tipo","valor","meta","status"]];
  const t = today();
  for (const h of state.habits){
    for (let d = h.createdAt, i = 0; d <= t && i < 3660; d = addDays(d,1), i++){
      if (!onDay(h,d)) continue;
      const c = getCount(h,d), sk = isSkipped(h,d);
      const status = sk ? "pulado" : h.kind === "avoid" ? (c ? "deslize" : "sem deslize") : (c >= h.target ? "feito" : c ? "parcial" : "não feito");
      rows.push([d, WD_LONG[dow(d)], h.name, catName(h.cat), h.kind === "avoid" ? "evitar" : "criar", c, h.target, status]);
    }
  }
  for (const [d, j] of Object.entries(state.journal).sort()) rows.push([d, WD_LONG[dow(d)], "(diário)", "", "", j.mood ? MOODS[j.mood-1][1] : "", "", j.text.replace(/\s+/g," ")]);
  for (const x of sortTasks(state.tasks)) rows.push([x.due, x.due ? WD_LONG[dow(x.due)] : "", x.title, x.cat ? catName(x.cat) : "", "tarefa", x.time, PRIOS[x.prio][0], x.done ? "feita em " + x.doneAt : "pendente"]);
  return "\uFEFF" + rows.map(r => r.map(q).join(";")).join("\r\n");
}

/* virada do dia e lembretes com o app aberto */
let lastDay = today();
function primeReminders(){
  const t = today(), n = nowHM();
  for (const x of live()) if (x.remind && x.remind <= n) ui.notified.add(x.id + t);
  for (const x of state.tasks) if (x.due === t && x.time && x.time <= n) ui.notified.add("t" + x.id + t);
}
function tickClock(){
  const t = today();
  if (t !== lastDay){ lastDay = t; ui.notified.clear(); primeReminders(); if (ui.followToday) ui.selDate = t; if ($("#sheet").hidden) render(); return; }
  const n = nowHM(); let fired = null;
  for (const x of live()){
    if (!x.remind || x.remind > n || ui.notified.has(x.id + t)) continue;
    ui.notified.add(x.id + t);
    if (counts(x,t) && !isDone(x,t)) fired = x;
  }
  let firedT = null;
  for (const x of pendingTasks()){
    if (x.due !== t || !x.time || x.time > n || ui.notified.has("t" + x.id + t)) continue;
    ui.notified.add("t" + x.id + t); firedT = x;
  }
  if (fired){ toast(`⏰ Hora de: ${fired.emoji} ${fired.name}`); vibrate([100,60,100]); sfx("done"); }
  else if (firedT){ toast(`⏰ Tarefa: ${firedT.title}`); vibrate([100,60,100]); sfx("done"); }
  if ((fired || firedT) && $("#sheet").hidden && ui.tab !== "settings") render();
}
document.addEventListener("visibilitychange", () => { if (!document.hidden){ tickClock(); if (tmr) tickTimer(); } });
setInterval(tickClock, 20000);
window.addEventListener("storage", e => { if (e.key === KEY){ state = loadState(); if ($("#sheet").hidden) render(); } });

if (!IN_CLAUDE && "serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
if (!IN_CLAUDE && navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
persistLocal();
markBadgesSeen();
primeReminders();
render();
initCaps();
</script>
</body>
